
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türk Bayrağı Boyama Etkinliği</title>
  <style>
    :root {
      --primary: #e30a17;
      --primary-dark: #b80812;
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #2d3748;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: #718096;
      font-size: 0.95rem;
    }

    .app-container {
      background: var(--card-bg);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 900px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 1rem;
    }

    .palette {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .palette-button {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .palette-button:hover {
      transform: scale(1.1);
    }

    .palette-button[aria-pressed="true"] {
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(227, 10, 23, 0.3);
      transform: scale(1.05);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button.btn {
      background: #edf2f7;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    button.btn:hover {
      background: #e2e8f0;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary-dark);
    }

    button.btn-primary:hover {
      background: var(--primary-dark);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      background: white;
      border: 2px dashed var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene[hidden] {
      display: none;
    }

    .artwork {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      visibility: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-container {
      flex-grow: 1;
      margin: 0 1rem;
    }

    .progress-bar-bg {
      background: var(--border);
      border-radius: 1rem;
      height: 0.75rem;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: #718096;
      text-align: center;
      margin-top: 0.25rem;
    }

    #status {
      font-size: 0.9rem;
      color: var(--primary);
      text-align: center;
      font-weight: 500;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Türk Bayrağı Boyama Etkinliği</h1>
    <p class="subtitle">İstediğin rengi seç ve beyaz alanlara tıklayarak boyamaya başla!</p>
  </header>

  <div class="app-container">
    <div class="toolbar">
      <!-- Renk Paleti -->
      <div class="palette" role="toolbar" aria-label="Renk Paleti">
        <button class="palette-button" data-color="#e30a17" aria-label="Kırmızı" aria-pressed="true" style="background-color: #e30a17;"></button>
        <button class="palette-button" data-color="#ffffff" aria-label="Beyaz" aria-pressed="false" style="background-color: #ffffff;"></button>
        <button class="palette-button" data-color="#0056b3" aria-label="Mavi" aria-pressed="false" style="background-color: #0056b3;"></button>
        <button class="palette-button" data-color="#ffcc00" aria-label="Sarı" aria-pressed="false" style="background-color: #ffcc00;"></button>
        <button class="palette-button" data-color="#28a745" aria-label="Yeşil" aria-pressed="false" style="background-color: #28a745;"></button>
        <button class="palette-button" data-color="#6f42c1" aria-label="Mor" aria-pressed="false" style="background-color: #6f42c1;"></button>
        <button class="palette-button" data-color="#343a40" aria-label="Siyah" aria-pressed="false" style="background-color: #343a40;"></button>
      </div>

      <!-- İşlem Butonları -->
      <div class="actions">
        <button id="clear" class="btn">Sayfayı Temizle</button>
        <button id="open" class="btn">Dosya Aç</button>
        <button id="save" class="btn btn-primary">Kaydet</button>
        <input type="file" id="file-input" accept=".json" style="display: none;">
      </div>
    </div>

    <!-- Boyama Alanları (Sayfalar) -->
    <div class="canvas-container">
      <div class="scene" data-scene="0">
        <div class="artwork">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
            <rect width="1536" height="1024" fill="#ffffff"/>
            <g stroke="#2d3748" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round">
              <!-- Klasik Türk Bayrağı: Ay ve Yıldız -->
              <rect x="96" y="96" width="1344" height="832" rx="32" />
              <circle cx="600" cy="512" r="240" fill="none" />
              <circle cx="680" cy="512" r="192" fill="#ffffff" />
              <polygon points="920,512 805,475 842,360 762,442 675,412 735,512 675,612 762,582 842,664 805,549" fill="none" />
            </g>
          </svg>
        </div>
        <canvas tabindex="0" aria-label="Boyama Sayfası 1"></canvas>
      </div>
      <div class="scene" data-scene="1" hidden>
        <div class="artwork">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
            <rect width="1536" height="1024" fill="#ffffff"/>
            <g stroke="#2d3748" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round">
              <!-- Çocuk ve Bayrak Temalı Çizim -->
              <rect x="96" y="96" width="1344" height="832" rx="32" />
              <circle cx="500" cy="380" r="90" />
              <path d="M 400,650 C 400,500 600,500 600,650" />
              <line x1="550" y1="580" x2="850" y2="250" stroke-width="16" />
              <path d="M 850,250 C 950,230 1050,270 1150,250 L 1100,400 C 1000,420 900,380 850,400 Z" />
            </g>
          </svg>
        </div>
        <canvas tabindex="0" aria-label="Boyama Sayfası 2"></canvas>
      </div>
      <div class="scene" data-scene="2" hidden>
        <div class="artwork">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
            <rect width="1536" height="1024" fill="#ffffff"/>
            <g stroke="#2d3748" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round">
              <!-- Dalgalanan Bayrak -->
              <rect x="96" y="96" width="1344" height="832" rx="32" />
              <path d="M 300,250 Q 600,150 900,250 T 1300,250 L 1300,750 Q 1000,850 700,750 T 300,750 Z" />
              <circle cx="600" cy="500" r="120" />
              <polygon points="850,500 770,470 795,395 745,445 675,420 720,500 675,580 745,555 795,605 770,530" />
            </g>
          </svg>
        </div>
        <canvas tabindex="0" aria-label="Boyama Sayfası 3"></canvas>
      </div>
    </div>

    <div id="status" aria-live="polite"></div>

    <!-- Sayfa Navigasyonu ve İlerleme -->
    <div class="navigation">
      <button id="previous" class="btn" disabled>Önceki Sayfa</button>
      
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div id="progress-text" class="progress-text">0 / 0 alan</div>
      </div>

      <button id="next" class="btn">Sonraki Sayfa</button>
    </div>
    <div id="page-indicator" style="text-align: center; font-size: 0.85rem; color: #718096;">Sayfa 1 / 3</div>
  </div>

  <script>
    (() => {
      const buttons = [...document.querySelectorAll('.palette-button')];
      const colors = buttons.map(button => button.dataset.color);
      const scenes = [...document.querySelectorAll('.scene')];
      
      const pages = scenes.map((scene) => {
        const svgEl = scene.querySelector('svg');
        const canvasEl = scene.querySelector('canvas');
        return {
          svg: svgEl,
          canvas: canvasEl,
          labels: null,
          regions: [],
          painted: {},
          pending: null,
          cursor: { x: 0.5, y: 0.5 }
        };
      });

      const status = document.getElementById('status');
      const fileInput = document.getElementById('file-input');
      let page = 0;
      let selected = colors[0];

      function progress() {
        const total = pages.reduce((n, p) => n + p.regions.length, 0);
        const count = pages.reduce((n, p) => n + Object.keys(p.painted).filter(id => p.regions[Number(id)]).length, 0);
        document.getElementById('progress-text').textContent = `${count} / ${total} alan`;
        document.getElementById('progress-fill').style.width = `${total ? count / total * 100 : 0}%`;
        const bar = document.getElementById('progress-bar-fill').parentElement;
        bar.setAttribute('aria-valuemax', String(total));
        bar.setAttribute('aria-valuenow', String(count));
      }

      function displayPage(index) {
        page = index;
        scenes.forEach((scene, i) => { scene.hidden = i !== page; });
        document.getElementById('page-indicator').textContent = `Sayfa ${page + 1} / ${pages.length}`;
        document.getElementById('previous').disabled = page === 0;
        document.getElementById('next').disabled = page === pages.length - 1;
        status.textContent = '';
      }

      function prepare(p) {
        const bbox = p.svg.viewBox.baseVal;
        const w = bbox.width || 1536;
        const h = bbox.height || 1024;
        
        const source = document.createElement('canvas');
        source.width = w;
        source.height = h;
        const context = source.getContext('2d', { willReadFrequently: true });

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(p.svg);
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);
        const imageObj = new Image();

        imageObj.onload = () => {
          try {
            context.drawImage(imageObj, 0, 0, w, h);
            p.original = context.getImageData(0, 0, w, h);
          } catch (e) {
            p.canvas.style.pointerEvents = 'none';
            status.textContent = 'Görsel yüklenirken bir hata oluştu.';
            return;
          }
          URL.revokeObjectURL(blobURL);

          p.canvas.width = w;
          p.canvas.height = h;

          const pixels = p.original.data;
          const size = w * h;
          const labels = new Int32Array(size);
          labels.fill(-1);
          const queue = new Int32Array(size);
          const regions = [];

          const isFillable = (pos) => {
            const i = pos * 4;
            const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2], a = pixels[i + 3];
            return a >= 180 && Math.min(r, g, b) >= 230;
          };

          for (let start = 0; start < size; start++) {
            if (labels[start] !== -1 || !isFillable(start)) continue;

            const id = regions.length;
            let head = 0, tail = 0;
            queue[tail++] = start;
            labels[start] = id;
            const points = [];

            while (head < tail) {
              const pos = queue[head++];
              points.push(pos);

              const x = pos % w;
              const neighbors = [
                x > 0 ? pos - 1 : -1,
                x < w - 1 ? pos + 1 : -1,
                pos >= w ? pos - w : -1,
                pos < size - w ? pos + w : -1
              ];

              for (const next of neighbors) {
                if (next < 0 || labels[next] !== -1 || !isFillable(next)) continue;
                labels[next] = id;
                queue[tail++] = next;
              }
            }

            regions.push(points);
          }

          const borderIds = new Set();
          const markBorder = (pos) => {
            if (pos >= 0 && pos < size && labels[pos] >= 0) {
              borderIds.add(labels[pos]);
            }
          };

          for (let x = 0; x < w; x++) {
            markBorder(x);
            markBorder((h - 1) * w + x);
          }
          for (let y = 0; y < h; y++) {
            markBorder(y * w);
            markBorder(y * w + w - 1);
          }

          const minUsefulPixels = Math.max(12, Math.floor(size * 0.000015));
          const filteredRegions = [];
          const remap = new Int32Array(regions.length);
          remap.fill(-1);

          regions.forEach((points, oldId) => {
            const touchesBorder = borderIds.has(oldId);
            const tooSmall = points.length < minUsefulPixels;

            if (!tooSmall && !touchesBorder) {
              remap[oldId] = filteredRegions.length;
              filteredRegions.push(points);
            }
          });

          regions.forEach((points, oldId) => {
            if (remap[oldId] !== -1 || points.length < minUsefulPixels) return;

            const touchesBorder = borderIds.has(oldId);
            if (touchesBorder && points.length < size * 0.12) {
              remap[oldId] = filteredRegions.length;
              filteredRegions.push(points);
            }
          });

          for (let i = 0; i < labels.length; i++) {
            const oldId = labels[i];
            labels[i] = oldId >= 0 ? remap[oldId] : -1;
          }

          p.labels = labels;
          p.regions = filteredRegions;
          p.painted = p.pending || {};
          p.pending = null;

          render(p);
          progress();
        };

        imageObj.onerror = () => {
          status.textContent = 'SVG görselleri yüklenemedi.';
        };

        imageObj.src = blobURL;
      }

      function render(p) {
        if (!p.original) return;

        const output = new ImageData(
          new Uint8ClampedArray(p.original.data),
          p.canvas.width,
          p.canvas.height
        );
        const data = output.data;

        for (const [key, hex] of Object.entries(p.painted)) {
          const points = p.regions[Number(key)];
          if (!points || !colors.includes(hex)) continue;

          const rgb = [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
          ];

          for (const pos of points) {
            const i = pos * 4;
            const shade = Math.max(
              0.78,
              Math.min(data[i], data[i + 1], data[i + 2]) / 255
            );

            for (let channel = 0; channel < 3; channel++) {
              data[i + channel] = Math.round(rgb[channel] * shade);
            }
          }
        }

        p.canvas.getContext('2d').putImageData(output, 0, 0);
      }

      function paintAt(p, x, y) {
        if (!p.labels) {
          status.textContent = 'Görsel henüz boyamaya hazır değil.';
          return;
        }

        const w = p.canvas.width, h = p.canvas.height;
        const px = Math.max(0, Math.min(w - 1, Math.floor(x * w)));
        const py = Math.max(0, Math.min(h - 1, Math.floor(y * h)));

        let id = p.labels[py * w + px];

        if (id < 0) {
          const tolerance = Math.max(8, Math.min(28, Math.round(Math.min(w, h) * 0.012)));

          outer:
          for (let radius = 1; radius <= tolerance; radius++) {
            for (let dy = -radius; dy <= radius; dy++) {
              for (let dx = -radius; dx <= radius; dx++) {
                const nx = px + dx, ny = py + dy;
                if (
                  nx >= 0 && nx < w && ny >= 0 && ny < h &&
                  p.labels[ny * w + nx] >= 0
                ) {
                  id = p.labels[ny * w + nx];
                  break outer;
                }
              }
            }
          }
        }

        if (id < 0) {
          status.textContent = 'Boyamak için resmin içindeki beyaz alana dokun.';
          return;
        }

        p.painted[id] = selected;
        render(p);
        progress();
        status.textContent = 'Alan boyandı!';
      }

      pages.forEach(p => {
        prepare(p);
        p.canvas.addEventListener('pointerup', event => {
          if (event.button !== undefined && event.button !== 0) return;
          const rect = p.canvas.getBoundingClientRect();
          p.cursor = {
            x: (event.clientX - rect.left) / rect.width,
            y: (event.clientY - rect.top) / rect.height
          };
          paintAt(p, p.cursor.x, p.cursor.y);
        });
        p.canvas.addEventListener('keydown', event => {
          const moves = { ArrowLeft: [-0.025, 0], ArrowRight: [0.025, 0], ArrowUp: [0, -0.025], ArrowDown: [0, 0.025] };
          if (moves[event.key]) {
            event.preventDefault();
            p.cursor.x = Math.max(0, Math.min(1, p.cursor.x + moves[event.key][0]));
            p.cursor.y = Math.max(0, Math.min(1, p.cursor.y + moves[event.key][1]));
            status.textContent = 'Konum seçildi. Boyamak için Enter tuşuna bas.';
          } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            paintAt(p, p.cursor.x, p.cursor.y);
          }
        });
      });

      buttons.forEach(button => button.addEventListener('click', () => {
        selected = button.dataset.color;
        buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        status.textContent = `${button.getAttribute('aria-label')} seçildi.`;
      }));

      document.getElementById('previous').addEventListener('click', () => { if (page > 0) displayPage(page - 1); });
      document.getElementById('next').addEventListener('click', () => { if (page < pages.length - 1) displayPage(page + 1); });
      
      document.getElementById('clear').addEventListener('click', () => {
        pages[page].painted = {};
        pages[page].pending = null;
        render(pages[page]);
        progress();
        status.textContent = 'Bu sayfa temizlendi.';
      });

      document.getElementById('save').addEventListener('click', () => {
        const file = new Blob([JSON.stringify({ version: 3, page, pages: pages.map(p => p.painted) })], { type: 'application/json' });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'turk-bayragi-boyamam.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = 'Boyaman dosya olarak kaydedildi.';
      });

      document.getElementById('open').addEventListener('click', () => fileInput.click());
      
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        try {
          const saved = JSON.parse(await file.text());
          if (saved.version !== 3 || !Array.isArray(saved.pages) || saved.pages.length !== 3) throw new Error('invalid');
          const restored = saved.pages.map((entry, index) => {
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)) throw new Error('invalid');
            const clean = {};
            for (const [key, value] of Object.entries(entry)) {
              if (!/^(0|[1-9]\d*)$/.test(key) || !colors.includes(value) || (pages[index].labels && !pages[index].regions[Number(key)])) throw new Error('invalid');
              clean[key] = value;
            }
            return clean;
          });
          restored.forEach((entry, index) => {
            pages[index].painted = entry;
            if (!pages[index].labels) pages[index].pending = entry;
            render(pages[index]);
          });
          displayPage(Number.isInteger(saved.page) && saved.page >= 0 && saved.page < 3 ? saved.page : 0);
          progress();
          status.textContent = 'Kaydedilmiş boyaman açıldı.';
        } catch {
          status.textContent = 'Dosya açılamadı. Bu etkinlikten kaydettiğin bir dosyayı seç.';
        }
        fileInput.value = "";
      });
      progress();
    })();
  </script>
</body>
</html>
